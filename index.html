<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#641d24" />
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Music">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Music</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&family=Sacramento&display=swap" rel="stylesheet">
  <style>
    :root {
      --wine: #641d24;
      --cream: #f7f0e7;
      --muted: rgba(247, 240, 231, .68);
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }
    
    * {
      box-sizing: border-box
    }
    
    html {
      scroll-behavior: smooth
    }
    
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      background: var(--wine);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden
    }
    
    button {
      font: inherit
    }
    
    .page {
      position: relative;
      min-height: 100svh;
      max-width: 1500px;
      margin: auto;
      overflow: hidden;
      isolation: isolate;
      background: radial-gradient(ellipse at 72% 24%, rgba(130, 55, 60, .16), transparent 40%), linear-gradient(135deg, #681f26 0%, #5b1920 58%, #641d24 100%)
    }
    
    .grain {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: .11;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")
    }
    
    .hero {
      position: relative;
      min-height: 760px;
      height: 100svh;
      max-height: 1050px;
      overflow: hidden
    }
    
    .vinyl {
      position: absolute;
      width: min(78vw, 850px);
      aspect-ratio: 1;
      left: -25%;
      top: 15%;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 0 7.4%, rgba(255, 255, 255, .07) 7.5% 7.7%, transparent 7.8% 13%, rgba(255, 255, 255, .06) 13.1% 13.3%, transparent 13.4% 21%, rgba(255, 255, 255, .055) 21.1% 21.3%, transparent 21.4% 30%, rgba(255, 255, 255, .055) 30.1% 30.3%, transparent 30.4% 39%, rgba(255, 255, 255, .06) 39.1% 39.3%, transparent 39.4% 48%, rgba(255, 255, 255, .06) 48.1% 48.3%, transparent 48.4% 57%, rgba(255, 255, 255, .055) 57.1% 57.3%, transparent 57.4% 66%, rgba(255, 255, 255, .06) 66.1% 66.3%, transparent 66.4% 75%, rgba(255, 255, 255, .06) 75.1% 75.3%, transparent 75.4% 84%, rgba(255, 255, 255, .06) 84.1% 84.3%, transparent 84.4%), repeating-conic-gradient(from 0deg, #111 0deg 1deg, #080808 1deg 2deg, #171717 2deg 3deg);
      box-shadow: inset -18px 0 40px #000, 12px 18px 45px rgba(0, 0, 0, .24)
    }
    
    .vinyl-center {
      position: absolute;
      z-index: 2;
      width: 28%;
      aspect-ratio: 1;
      left: 36%;
      top: 36%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, .7);
      box-shadow: 0 0 0 5px rgba(0, 0, 0, .35);
      pointer-events: none
    }
    
    .playing .vinyl {
      animation-play-state: running, running
    }
    
    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }
    
    .headline {
      position: absolute;
      z-index: 3;
      top: 6%;
      right: 12%;
      text-align: center;
      line-height: .82;
      user-select: none
    }
    
    .headline .only {
      display: block;
      font: 600 clamp(58px, 9vw, 112px)/.9 "Playfair Display", serif;
      letter-spacing: -.055em
    }
    
    .polaroid {
      position: absolute;
      z-index: 2;
      width: clamp(180px, 32vw, 390px);
      padding: clamp(10px, 1.5vw, 18px) clamp(10px, 1.5vw, 18px) clamp(42px, 6vw, 72px);
      background: #f8f6f1;
      box-shadow: 0 16px 35px rgba(0, 0, 0, .25);
      transition: transform .45s ease, box-shadow .45s ease
    }
    
    .polaroid:hover {
      z-index: 4;
      box-shadow: 0 24px 42px rgba(0, 0, 0, .32)
    }
    
    .polaroid img {
      display: block;
      width: 100%;
      aspect-ratio: 1.13/1;
      object-fit: cover;
      filter: saturate(.82) sepia(.08)
    }
    
    .photo-one {
      left: 22%;
      top: 18%;
      transform: rotate(-10deg)
    }
    
    .photo-two {
      left: 43%;
      top: 45%;
      transform: rotate(12deg)
    }
    
    .photo-three {
      left: 25%;
      top: 70%;
      transform: rotate(-8deg)
    }
    
    .photo-one:hover {
      transform: translateY(-8px) rotate(-2deg) scale(1.025)
    }
    
    .photo-two:hover {
      transform: translateY(-8px) rotate(2deg) scale(1.025)
    }
    
    .photo-three:hover {
      transform: translateY(-8px) rotate(-1deg) scale(1.025)
    }
    
    .music-section {
      position: relative;
      z-index: 6;
      padding: 75px 22px 90px;
      background: linear-gradient(180deg, rgba(45, 12, 17, .05), rgba(20, 5, 8, .72))
    }
    
    .music-wrap {
      width: min(780px, 100%);
      margin: auto
    }
    
    .section-kicker {
      text-align: center;
      font-size: 10px;
      letter-spacing: .3em;
      color: #d8bfc0;
      text-transform: uppercase
    }
    
    .section-title {
      text-align: center;
      font: 500 clamp(32px, 6vw, 52px) "Playfair Display", serif;
      margin: 12px 0 34px
    }
    
    .player {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 20px;
      align-items: center;
      padding: 20px;
      background: rgba(35, 10, 14, .68);
      border: 1px solid rgba(216, 191, 192, .18);
      border-radius: 4px;
      backdrop-filter: blur(12px)
    }
    
    .cover {
      width: 88px;
      aspect-ratio: 1;
      object-fit: cover;
      background: #2b1014;
      filter: sepia(.15) saturate(.8)
    }
    
    .track-meta {
      min-width: 0
    }
    
    .track-label {
      color: #c9aeb0;
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase
    }
    
    .track-name {
      font: 500 23px "Playfair Display", serif;
      margin: 5px 0 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }
    
    .track-artist {
      color: var(--muted);
      font-size: 12px
    }
    
    .progress-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      color: #d4c0bf;
      font-size: 10px;
      font-variant-numeric: tabular-nums
    }
    
    input[type=range] {
      accent-color: var(--cream);
      cursor: pointer
    }
    
    #progress {
      flex: 1;
      width: 100%;
      height: 3px
    }
    
    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 24px;
      margin: 22px 0 5px
    }
    
    .control {
      border: 0;
      color: var(--cream);
      background: transparent;
      cursor: pointer;
      padding: 8px;
      opacity: .82;
      transition: opacity .2s, transform .2s
    }
    
    .control:hover {
      opacity: 1;
      transform: scale(1.08)
    }
    
    .control.main {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--cream);
      color: var(--wine);
      font-size: 17px;
      opacity: 1
    }
    
    .volume-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      color: #d4c0bf;
      font-size: 10px
    }
    
    #volume {
      width: 90px;
      height: 3px
    }
    
    .listen-link {
      display: block;
      width: fit-content;
      margin: 14px auto 0;
      color: #d8bfc0;
      font-size: 10px;
      letter-spacing: .08em;
      border-bottom: 1px solid rgba(247, 240, 231, .28);
      padding-bottom: 4px
    }
    
    .playlist {
      margin-top: 30px;
      border-top: 1px solid rgba(255, 255, 255, .16)
    }
    
    .playlist-heading {
      display: flex;
      justify-content: space-between;
      color: #d8bfc0;
      font-size: 10px;
      letter-spacing: .2em;
      text-transform: uppercase;
      padding: 17px 2px 9px
    }
    
    .song {
      display: grid;
      grid-template-columns: 28px 38px 1fr auto;
      gap: 12px;
      align-items: center;
      width: 100%;
      padding: 13px 8px;
      border: 0;
      border-bottom: 1px solid rgba(255, 255, 255, .09);
      background: transparent;
      color: var(--cream);
      text-align: left;
      cursor: pointer
    }
    
    .song:hover,
    .song.active {
      background: rgba(255, 255, 255, .055)
    }
    
    .song-number {
      color: #c7a7aa;
      font-size: 11px
    }
    
    .song-thumb {
      display: block;
      width: 38px;
      height: 38px;
      object-fit: cover;
      background: #2b1014
    }
    
    .song-title {
      font: 500 16px "Playfair Display", serif
    }
    
    .song-artist {
      color: var(--muted);
      font-size: 11px;
      margin-top: 3px
    }
    
    .song-duration {
      color: #c7a7aa;
      font-size: 10px
    }
    
    .footer {
      padding: 25px;
      text-align: center;
      color: rgba(247, 240, 231, .45);
      font-size: 10px;
      letter-spacing: .16em
    }
    
    @media(min-width:900px) {
      .hero {
        min-height: 850px
      }
      
      .vinyl {
        left: -16%;
        top: 10%;
        width: min(67vw, 900px)
      }
      
      .photo-one {
        left: 25%;
        top: 15%
      }
      
      .photo-two {
        left: 48%;
        top: 43%
      }
      
      .photo-three {
        left: 27%;
        top: 68%
      }
      
      .headline {
        right: 14%;
        top: 7%
      }
    }
    
    @media(max-width:600px) {
      .hero {
        min-height: 790px;
        max-height: 900px
      }
      
      .vinyl {
        width: 112vw;
        left: -56%;
        top: 24%
      }
      
      .headline {
        top: 5%;
        right: 8%
      }
      
      .headline .only {
        font-size: clamp(54px, 15vw, 78px)
      }
      
      .polaroid {
        width: 47vw;
        padding: 8px 8px 34px
      }
      
      .polaroid img {
        aspect-ratio: 1.08/1
      }
      
      .photo-one {
        left: 20%;
        top: 20%
      }
      
      .photo-two {
        left: 43%;
        top: 46%
      }
      
      .photo-three {
        left: 22%;
        top: 69%
      }
      
      .music-section {
        padding: 58px 16px 65px
      }
      
      .player {
        grid-template-columns: 68px 1fr;
        gap: 13px;
        padding: 14px
      }
      
      .cover {
        width: 68px
      }
      
      .track-name {
        font-size: 19px
      }
      
      .controls {
        gap: 18px
      }
      
      .song {
        grid-template-columns: 20px 38px minmax(0, 1fr) auto;
        gap: 9px;
        padding: 11px 6px
      }
      
      .song-title {
        font-size: 12px
      }
      
      .song-artist {
        font-size: 10px
      }
      
      .song-duration {
        font-size: 8px
      }
    }
    
    /* ===== Single player card ===== */
    .player-card {
      background: rgba(35, 10, 14, .68);
      border: 1px solid rgba(216, 191, 192, .18);
      border-radius: 10px;
      padding: 22px 22px 28px;
      backdrop-filter: blur(12px)
    }
    
    .player-card .player {
      background: transparent;
      border: 0;
      padding: 0;
      backdrop-filter: none;
      border-radius: 0
    }
    
    @media(max-width:600px) {
      .player-card {
        padding: 14px 14px 22px
      }
    }
    
    /* ===== Scroll motion (up and down) ===== */
    .reveal.in[data-d="up"] {
      animation-name: revealDown
    }
    
    @keyframes revealDown {
      from {
        opacity: 0;
        translate: 0 -32px
      }
      
      to {
        opacity: 1;
        translate: 0 0
      }
    }
    
    .photo-one {
      margin-top: calc(var(--sy, 0)*-.10px)
    }
    
    .photo-two {
      margin-top: calc(var(--sy, 0)*-.18px)
    }
    
    .photo-three {
      margin-top: calc(var(--sy, 0)*-.05px)
    }
    
    .vinyl {
      margin-top: calc(var(--sy, 0)*.06px);
      rotate: calc(var(--sy, 0)*.12deg)
    }
    
    /* ===== Premium motion ===== */
    .vinyl {
      animation: vinylIn 1.8s cubic-bezier(.2, .8, .2, 1) both, spin 6s linear infinite paused;
      will-change: transform
    }
    
    @keyframes vinylIn {
      from {
        opacity: 0;
        translate: -14% 0
      }
      
      to {
        opacity: 1;
        translate: 0 0
      }
    }
    
    .hero::before {
      content: "";
      position: absolute;
      z-index: 1;
      width: 60vw;
      max-width: 800px;
      aspect-ratio: 1;
      right: -12%;
      top: -14%;
      background: radial-gradient(circle, rgba(210, 95, 105, .24), transparent 65%);
      filter: blur(30px);
      animation: drift 14s ease-in-out infinite alternate;
      pointer-events: none
    }
    
    @keyframes drift {
      to {
        translate: -9vw 7vh;
        scale: 1.2
      }
    }
    
    .headline {
      translate: 0 calc(var(--sy, 0)*.22px)
    }
    
    .headline .only span {
      display: inline-block;
      opacity: 0;
      animation: letter 1s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: calc(.5s + var(--i)*.1s);
      text-shadow: 0 8px 30px rgba(0, 0, 0, .25)
    }
    
    @keyframes letter {
      from {
        opacity: 0;
        translate: 0 40px;
        rotate: 6deg;
        filter: blur(8px)
      }
      
      to {
        opacity: 1;
        translate: 0 0;
        rotate: 0deg;
        filter: blur(0)
      }
    }
    
    .polaroid {
      animation: rise 1.2s cubic-bezier(.2, .8, .2, 1) both, float 8s ease-in-out 1.4s infinite;
      will-change: transform
    }
    
    .photo-two {
      animation-delay: .25s, 1.7s;
      animation-duration: 1.2s, 9s
    }
    
    .photo-three {
      animation-delay: .5s, 2s;
      animation-duration: 1.2s, 10s
    }
    
    @keyframes rise {
      from {
        opacity: 0;
        scale: .85;
        translate: 0 70px
      }
      
      to {
        opacity: 1;
        scale: 1;
        translate: 0 0
      }
    }
    
    @keyframes float {
      50% {
        translate: 0 -12px
      }
    }
    
    .reveal {
      opacity: 0
    }
    
    .reveal.in {
      animation: revealUp 1s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: var(--d, 0s)
    }
    
    @keyframes revealUp {
      from {
        opacity: 0;
        translate: 0 32px
      }
      
      to {
        opacity: 1;
        translate: 0 0
      }
    }
    
    .swap {
      animation: swap .7s cubic-bezier(.2, .8, .2, 1) both
    }
    
    @keyframes swap {
      from {
        opacity: 0;
        scale: .92
      }
      
      to {
        opacity: 1;
        scale: 1
      }
    }
    
    .playing .cover {
      animation: glow 2.6s ease-in-out infinite
    }
    
    @keyframes glow {
      50% {
        box-shadow: 0 0 34px rgba(216, 150, 155, .45)
      }
    }
    
    .playing .control.main {
      animation: ring 2.2s ease-out infinite
    }
    
    @keyframes ring {
      from {
        box-shadow: 0 0 0 0 rgba(247, 240, 231, .4)
      }
      
      to {
        box-shadow: 0 0 0 18px rgba(247, 240, 231, 0)
      }
    }
    
    .control:active {
      transform: scale(.9)
    }
    
    .control.main:hover {
      transform: scale(1.1)
    }
    
    .song {
      transition: background .35s ease, padding-left .35s cubic-bezier(.2, .8, .2, 1)
    }
    
    .song:hover {
      padding-left: 16px
    }
    
    .song.active .song-title {
      color: #fff
    }
    
    .song-duration {
      display: inline-flex;
      align-items: center;
      min-width: 14px;
      justify-content: flex-end
    }
    
    .song-duration b {
      font-weight: 400
    }
    
    .eq {
      display: none;
      gap: 2px;
      align-items: flex-end;
      height: 12px
    }
    
    .eq i {
      width: 2px;
      height: 100%;
      background: var(--cream);
      transform-origin: bottom;
      animation: eq 1s ease-in-out infinite
    }
    
    .eq i:nth-child(2) {
      animation-delay: .25s
    }
    
    .eq i:nth-child(3) {
      animation-delay: .5s
    }
    
    @keyframes eq {

      0%,
      100% {
        transform: scaleY(.25)
      }
      
      50% {
        transform: scaleY(1)
      }
    }
    
    .playing .song.active .eq {
      display: inline-flex
    }
    
    .playing .song.active .song-duration b {
      display: none
    }
    
    .player {
      transition: border-color .5s, transform .5s cubic-bezier(.2, .8, .2, 1)
    }
    
    .player:hover {
      border-color: rgba(216, 191, 192, .4)
    }
    
    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
      }
      
      .reveal {
        opacity: 1
      }
    }
    
    /* ===== Refined premium card ===== */
    .player-card {
      position: relative;
      border-radius: 26px;
      padding: 30px 30px 34px;
      background: linear-gradient(150deg, rgba(142, 46, 56, .55), rgba(56, 14, 21, .9) 55%, rgba(30, 7, 11, .94));
      border: 1px solid rgba(247, 240, 231, .14);
      box-shadow: 0 30px 70px rgba(10, 2, 4, .5), inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 0 60px rgba(216, 150, 155, .06);
      overflow: hidden
    }
    
    .player-card::before {
      content: "";
      position: absolute;
      inset: -35% -25% auto auto;
      width: 75%;
      aspect-ratio: 1;
      background: radial-gradient(circle, rgba(216, 150, 155, .24), transparent 65%);
      pointer-events: none;
      animation: drift 12s ease-in-out infinite alternate
    }
    
    .player-card>* {
      position: relative
    }
    
    .player-card .player {
      grid-template-columns: 108px 1fr;
      gap: 22px
    }
    
    .player-card .cover {
      width: 108px;
      border-radius: 14px;
      box-shadow: 0 16px 32px rgba(0, 0, 0, .5);
      filter: none
    }
    
    .track-label {
      color: #e3c8ca
    }
    
    .track-name {
      font-size: 26px
    }
    
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      height: 18px
    }
    
    #progress,
    #volume {
      height: 18px
    }
    
    input[type=range]::-webkit-slider-runnable-track {
      height: 4px;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--cream) var(--fill, 0%), rgba(247, 240, 231, .2) var(--fill, 0%))
    }
    
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--cream);
      margin-top: -5px;
      box-shadow: 0 0 0 4px rgba(247, 240, 231, .15);
      transition: box-shadow .25s
    }
    
    input[type=range]:hover::-webkit-slider-thumb {
      box-shadow: 0 0 0 8px rgba(247, 240, 231, .16)
    }
    
    input[type=range]::-moz-range-track {
      height: 4px;
      border-radius: 4px;
      background: rgba(247, 240, 231, .2)
    }
    
    input[type=range]::-moz-range-progress {
      height: 4px;
      border-radius: 4px;
      background: var(--cream)
    }
    
    input[type=range]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border: 0;
      border-radius: 50%;
      background: var(--cream)
    }
    
    .controls {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid rgba(247, 240, 231, .1)
    }
    
    .control.main {
      width: 56px;
      height: 56px;
      background: linear-gradient(145deg, #fff8ee, #e8d3c3);
      box-shadow: 0 12px 28px rgba(0, 0, 0, .4)
    }
    
    .playlist {
      margin-top: 28px;
      border: 1px solid rgba(247, 240, 231, .12);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(66, 17, 25, .6), rgba(24, 6, 9, .78));
      padding: 6px 14px 12px;
      box-shadow: 0 24px 60px rgba(10, 2, 4, .4)
    }
    
    .search {
      width: 100%;
      margin: 6px 0 10px;
      padding: 12px 18px;
      border-radius: 999px;
      border: 1px solid rgba(247, 240, 231, .14);
      background: rgba(0, 0, 0, .22);

      font: inherit;
      font-size: 13px;
      outline: 0;
      transition: border-color .3s, background .3s
    }
    
    .search::placeholder {
      color: rgba(247, 240, 231, .45)
    }
    
    .search:focus {
      border-color: rgba(247, 240, 231, .4);
      background: rgba(0, 0, 0, .32)
    }
    
    #songList {
      max-height: 480px;
      overflow-y: auto;
      scrollbar-width: thin;
      scrollbar-color: rgba(247, 240, 231, .3) transparent
    }
    
    .song {
      border-radius: 12px;
      border-bottom-color: transparent
    }
    
    .song.active {
      background: rgba(247, 240, 231, .1)
    }
    
    @media(max-width:600px) {
      .player-card {
        padding: 18px 16px 24px;
        border-radius: 22px
      }
      
      .player-card .player {
        grid-template-columns: 76px 1fr;
        gap: 14px
      }
      
      .player-card .cover {
        width: 76px;
        border-radius: 10px
      }
      
      .track-name {
        font-size: 19px
      }
      
      #songList {
        max-height: 420px
      }
    }
    
    /* ===== Smooth + centered icons ===== */
    .control {
      display: grid;
      place-items: center;
      -webkit-tap-highlight-color: transparent;
      transition: opacity .3s ease, transform .4s cubic-bezier(.2, .8, .2, 1), background .3s
    }
    
    .control svg {
      display: block;
      width: 22px;
      height: 22px;
      fill: currentColor
    }
    
    .control.main {
      padding: 0
    }
    
    .control.main svg {
      width: 24px;
      height: 24px
    }
    
    .song-duration svg {
      display: block
    }
    
    #songList {
      position: relative;
      scroll-behavior: smooth;
      overscroll-behavior: contain
    }
    
    .song {
      -webkit-tap-highlight-color: transparent
    }
    
    /* ===== Preloader ===== */
    body.loading {
      overflow: hidden
    }
    
    body.loading .vinyl,
    body.loading .polaroid,
    body.loading .headline .only span {
      animation-play-state: paused !important
    }
    
    .preloader {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 70% 25%, rgba(150, 60, 68, .3), transparent 45%), linear-gradient(135deg, #681f26, #5b1920 58%, #4a1219);
      transition: opacity .9s ease, visibility .9s, transform 1.1s cubic-bezier(.7, 0, .2, 1);
      animation: plFailsafe 0s 9s forwards
    }
    
    @keyframes plFailsafe {
      to {
        opacity: 0;
        visibility: hidden
      }
    }
    
    .preloader::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .11;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.28'/%3E%3C/svg%3E")
    }
    
    .preloader.hide {
      opacity: 0;
      visibility: hidden;
      transform: scale(1.06)
    }
    
    .pl-vinyl {
      position: relative;
      width: min(46vw, 190px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: radial-gradient(circle, transparent 0 22%, rgba(255, 255, 255, .07) 22.5% 23.5%, transparent 24% 36%, rgba(255, 255, 255, .06) 36.5% 37.5%, transparent 38% 50%, rgba(255, 255, 255, .06) 50.5% 51.5%, transparent 52% 64%, rgba(255, 255, 255, .055) 64.5% 65.5%, transparent 66%), repeating-conic-gradient(#111 0 1deg, #080808 1deg 2deg, #171717 2deg 3deg);
      box-shadow: 0 24px 60px rgba(0, 0, 0, .45), 0 0 70px rgba(216, 150, 155, .18), inset -8px 0 22px #000;
      animation: spin 3.2s linear infinite;
      opacity: 0;
      animation-name: plIn, spin;
      animation-duration: 1s, 3.2s;
      animation-fill-mode: forwards, none;
      animation-iteration-count: 1, infinite;
      animation-timing-function: cubic-bezier(.2, .8, .2, 1), linear
    }
    
    @keyframes plIn {
      from {
        opacity: 0;
        scale: .7
      }
      
      to {
        opacity: 1;
        scale: 1
      }
    }
    
    .pl-vinyl::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: conic-gradient(from 20deg, transparent 0 20%, rgba(255, 255, 255, .13) 25%, transparent 30% 70%, rgba(255, 255, 255, .1) 75%, transparent 80%)
    }
    
    .pl-vinyl span {
      position: absolute;
      inset: 34%;
      border-radius: 50%;
      background: radial-gradient(circle, #090909 0 7%, #d8bfc0 8% 55%, #8a2c35 56% 100%);
      border: 2px solid rgba(255, 255, 255, .55);
      z-index: 1
    }
    
    .pl-word {
      display: flex;
      margin-top: 36px;
      padding-left: .28em;
      font: 600 clamp(40px, 11vw, 64px)/1 "Playfair Display", serif;
      letter-spacing: .28em;
      color: var(--cream);
      position: relative;
      z-index: 1
    }
    
    .pl-word span {
      display: inline-block;
      opacity: 0;
      animation: plLetter .9s cubic-bezier(.2, .8, .2, 1) both;
      animation-delay: calc(.3s + var(--i)*.09s)
    }
    
    @keyframes plLetter {
      from {
        opacity: 0;
        translate: 0 26px;
        filter: blur(8px)
      }
      
      to {
        opacity: 1;
        translate: 0 0;
        filter: blur(0)
      }
    }
    
    .pl-sub {
      position: relative;
      z-index: 1;
      margin-top: 4px;
      font: 400 clamp(26px, 7vw, 36px)/1.2 "Sacramento", cursive;
      color: #d8bfc0;
      opacity: 0;
      animation: plFade 1s 1s both
    }
    
    @keyframes plFade {
      from {
        opacity: 0;
        translate: 0 10px
      }
      
      to {
        opacity: 1;
        translate: 0 0
      }
    }
    
    .pl-bar {
      position: relative;
      z-index: 1;
      width: min(52vw, 220px);
      height: 2px;
      margin-top: 26px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(247, 240, 231, .18)
    }
    
    .pl-bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #d8bfc0, #f7f0e7);
      transform-origin: left;
      transform: scaleX(0)
    }
    
    .pl-pct {
      position: relative;
      z-index: 1;
      margin-top: 12px;
      font-size: 10px;
      letter-spacing: .3em;
      color: rgba(247, 240, 231, .6);
      font-variant-numeric: tabular-nums
    }
    
    /* ===== Offline status ===== */
    .offline-status {
      margin: 2px 2px 10px;
      padding: 10px 14px;
      border-radius: 12px;
      background: rgba(0, 0, 0, .2);
      border: 1px solid rgba(247, 240, 231, .1);
      font-size: 10px;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: #d8bfc0
    }
    
    .offline-status {
      display: none !important
    }
    
    .offline-status[hidden] {
      display: none
    }
    
    .offline-status i {
      display: block;
      height: 2px;
      margin-top: 8px;
      border-radius: 2px;
      background: rgba(247, 240, 231, .15);
      overflow: hidden
    }
    
    .offline-status b {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #d8bfc0, #f7f0e7);
      transition: width .4s ease
    }
  </style>
</head>

  </main>
  <audio id="audio" preload="metadata"></audio>
  <script>
    // SONG LIBRARY: MP3s go in /music/, covers in /covers/.
    const songs = [
      ["Fake Love", "BTS", "music/fake-love.mp3", "covers/Polaroid-1.jpg"],
      ["Black Swan", "BTS", "music/BTS__방탄소년단___Black_Swan__Official_MV(256k).mp3", "covers/black-swan.jpg"],
      ["Spring Day", "BTS", "music/BTS__방탄소년단___봄날__Spring_Day___Official_MV(48k).mp3", "covers/1.jpg"],
      ["Run", "BTS", "music/BTS__방탄소년단___RUN__Official_MV(48k).mp3", "covers/2.jpg"],
      ["Blood Sweat & Tears", "BTS", "music/BTS__방탄소년단___피_땀_눈물__Blood_Sweat___Tears___Official_MV(48k).mp3", "covers/3.jpg"],
      ["Euphoria", "BTS (Jungkook)", "music/[ENGSUB]_BTS__방탄소년단__-_Euphoria_live(48k).mp3", "covers/4.jpg"],

      ["Mikrokosmos", "BTS", "music/BTS__방탄소년단__-_Mikrokosmos__소우주___Color_Coded_Lyrics_Eng_Rom_Han_가사_(48k).mp3", "covers/6.jpg"],
      ["Butter", "BTS", "music/BTS__방탄소년단___Butter__Official_MV(48k).mp3", "covers/7.jpg"],
      ["DNA", "BTS", "music/BTS__방탄소년단___DNA__Official_MV(48k).mp3", "covers/8.jpg"],
      ["Save Me", "BTS", "music/BTS__방탄소년단___Save_ME__Official_MV(48k).mp3", "covers/9.jpg"],
      ["Blue & Grey", "BTS", "music/BTS_Performs__Blue___Grey____MTV_Unplugged_Presents__BTS(48k).mp3", "covers/10.jpg"],
      ["HOME", "BTS", "music/HOME(48k).mp3", "covers/11.jpg"],
      ["IDOL", "BTS", "music/BTS__방탄소년단___IDOL__Official_MV(48k).mp3", "covers/12.jpg"],
      ["ON", "BTS", "music/BTS__방탄소년단___ON__Kinetic_Manifesto_Film___Come_Prima(48k).mp3", "covers/13.jpg"],
      ["Seven", "Jungkook", "music/정국__Jung_Kook___Seven__feat._Latto___Official_MV(48k).mp3", "covers/14.jpg"],
      ["Like Crazy", "Jimin", "music/지민__Jimin___Like_Crazy__Official_MV(48k).mp3", "covers/15.jpg"],
      ["Love Me Again", "V", "music/V__Love_Me_Again__Official_MV(48k).mp3", "covers/16.jpg"],
      ["The Astronaut", "Jin", "music/the-astrounat.mp3", "covers/17.jpg"],
      ["Daechwita", "Agust D (SUGA)", "music/Agust_D__대취타__MV(48k).mp3", "covers/18.jpg"],
      ["Wild Flower", "RM", "music/RM__들꽃놀이__with_조유진___Official_MV(48k).mp3", "covers/20.jpg"],
      ["Standing Next to You", "Jungkook", "music/정국__Jung_Kook___Standing_Next_to_You__Official_MV(48k).mp3", "covers/21.jpg"],
      ["Set Me Free Pt.2", "Jimin", "music/지민__Jimin___Set_Me_Free_Pt.2__Official_MV(48k).mp3", "covers/22.jpg"],
      ["Slow Dancing", "V", "music/V__Slow_Dancing__Official_MV(48k).mp3", "covers/24.jpg"],
      ["I’ll Be There", "Jin", "music/진__Jin___I_ll_Be_There__Official_MV(48k).mp3", "covers/23.jpg"],
      ["Snooze", "Agust D (SUGA)", "music/BTS__방탄소년단__Agust_D_Ft._Ryuichi_Sakamoto___WOOSUNG__Snooze__MV(48k).mp3", "covers/25.jpg"],
      ["Lonely", "RM", "music/Lonely(48k).mp3", "covers/27.jpg"],
      ["Still With You", "Jungkook", "music/Still_With_You(48k).mp3", "covers/28.jpg"],
      ["MORE", "j-hope", "music/j-hope__MORE__Official_MV(256k).mp3", "covers/26.jpg"],
      ["Arson", "j-hope", "music/j-hope__방화__Arson___Official_MV(48k).mp3", "covers/19.jpg"],
    ].map(([title, artist, src, cover]) => ({ title, artist, src, cover }));
    
    const $ = id => document.getElementById(id);
    const audio = $("audio"),
      page = $("page");
    const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M8.4 5.5v13L19.4 12z"/></svg>',
      ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M7 5.5h3.6v13H7zM13.4 5.5H17v13h-3.4z"/></svg>';
    let cur = -1;
    const fmt = s => isFinite(s) ? Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0") : "0:00";
    
    // Placeholder when an image file is missing
    const ph = "data:image/svg+xml," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='#8a2c35'/><stop offset='1' stop-color='#3b0f14'/></linearGradient></defs><rect width='10' height='10' fill='url(#g)'/></svg>");
    
    function guard(img) { img.onerror = () => { img.onerror = null;
        img.src = ph } }
    
    $("songCount").textContent = songs.length + " songs";
    $("songList").innerHTML = songs.map((s, i) => `<button class="song" data-i="${i}"><span class="song-number">${i+1}</span><img class="song-thumb" src="${s.cover}" alt=""><span><div class="song-title">${s.title}</div><div class="song-artist">${s.artist}</div></span><span class="song-duration"><span class="eq"><i></i><i></i><i></i></span><b><svg viewBox="0 0 24 24" width="12" height="12" fill="currentColor"><path d="M8.4 5.5v13L19.4 12z"/></svg></b></span></button>`).join("");
    document.querySelectorAll("img").forEach(guard);
    
    // Headline letter-by-letter reveal
    const only = document.querySelector(".headline .only");
    only.innerHTML = [...only.textContent].map((c, i) => `<span style="--i:${i}">${c}</span>`).join("");
    
    // Scroll reveal with stagger
    document.querySelectorAll(".section-kicker,.section-title,.player-card,.playlist-heading").forEach((el, i) => { el.classList.add("reveal");
      el.style.setProperty("--d", (i * .08) + "s") });
    document.querySelectorAll(".song").forEach((el, i) => { el.classList.add("reveal");
      el.style.setProperty("--d", Math.min(i % 8 * .05, .4) + "s") });
    let dir = "down",
      lastY = scrollY;
    const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.dataset.d = dir;
        e.target.classList.add("in") } else e.target.classList.remove("in") }), { threshold: .1 });
    document.querySelectorAll(".reveal").forEach(el => io.observe(el));
    
    // Gentle parallax on the headline
    let tick = false;
    let cy = scrollY,
      running = false;
    
    function loop() { const t = Math.min(scrollY, 1800);
      cy += (t - cy) * .12; if (Math.abs(t - cy) < .05) cy = t;
      page.style.setProperty("--sy", cy.toFixed(2)); if (cy !== t) requestAnimationFrame(loop);
      else running = false }
    addEventListener("scroll", () => { const y = scrollY; if (Math.abs(y - lastY) > 2) { dir = y > lastY ? "down" : "up";
        lastY = y } if (!running) { running = true;
        requestAnimationFrame(loop) } }, { passive: true });
    
    // Smooth swap animation when the track changes
    function swap() {
      ["cover", "vinylCenter", "trackName", "trackArtist"].forEach(id => { const el = $(id);
        el.classList.remove("swap");
        void el.offsetWidth;
        el.classList.add("swap") }) }
    
    function load(i, autoplay) {
      cur = (i + songs.length) % songs.length;
      const s = songs[cur];
      audio.src = encodeURI(s.src.replace(/^\//, ""));
      $("trackName").textContent = s.title;
      $("trackArtist").textContent = s.artist;
      $("cover").src = s.cover;
      $("vinylCenter").src = s.cover;
      swap();
      document.querySelectorAll(".song").forEach((el, k) => el.classList.toggle("active", k === cur));
      if (autoplay) { const list = $("songList"),
          row = list.children[cur]; if (row) list.scrollTo({ top: row.offsetTop - list.clientHeight / 2 + row.offsetHeight / 2, behavior: "smooth" }) }
      $("progress").value = 0;
      $("progress").style.setProperty("--fill", "0%");
      $("currentTime").textContent = "0:00";
      $("duration").textContent = "0:00";
      if (autoplay) audio.play().catch(() => setPlaying(false));
    }
    
    function setPlaying(p) {
      page.classList.toggle("playing", p);
      $("play").innerHTML = p ? ICON_PAUSE : ICON_PLAY;
      $("play").setAttribute("aria-label", p ? "Pause" : "Play");
    }
    $("songList").addEventListener("click", e => { const b = e.target.closest(".song"); if (b) load(+b.dataset.i, true) });
    $("play").onclick = () => { if (cur < 0) return load(0, true);
      audio.paused ? audio.play().catch(() => {}) : audio.pause() };
    $("prev").onclick = () => load(cur < 0 ? 0 : cur - 1, true);
    $("next").onclick = () => load(cur < 0 ? 0 : cur + 1, true);
    let drag = false,
      rid = 0;
    $("progress").addEventListener("pointerdown", () => drag = true);
    addEventListener("pointerup", () => drag = false);
    
    function upd() { $("currentTime").textContent = fmt(audio.currentTime); if (audio.duration && !drag) { const v = audio.currentTime / audio.duration * 100;
        $("progress").value = v;
        $("progress").style.setProperty("--fill", v + "%") } }
    
    function raf() { cancelAnimationFrame(rid);
      upd(); if (!audio.paused) rid = requestAnimationFrame(raf) }
    audio.onplay = () => { setPlaying(true);
      raf() };
    audio.onpause = () => setPlaying(false);
    audio.onended = () => load(cur + 1, true);
    audio.onloadedmetadata = () => $("duration").textContent = fmt(audio.duration);
    audio.ontimeupdate = () => {
      $("currentTime").textContent = fmt(audio.currentTime);
      if (audio.duration) { const v = audio.currentTime / audio.duration * 100;
        $("progress").value = v;
        $("progress").style.setProperty("--fill", v + "%") }
    };
    $("progress").oninput = e => { if (audio.duration) audio.currentTime = e.target.value / 100 * audio.duration };
    $("volume").oninput = e => audio.volume = e.target.value;
    audio.volume = .75;
    $("volume").style.setProperty("--fill", "75%");
    document.addEventListener("input", e => { const t = e.target; if (t.type === "range") t.style.setProperty("--fill", (t.value - t.min) / (t.max - t.min) * 100 + "%") });
    $("search").oninput = e => { const q = e.target.value.trim().toLowerCase(); let n = 0;
      document.querySelectorAll(".song").forEach((el, k) => { const s = songs[k]; const m = !q || (s.title + " " + s.artist).toLowerCase().includes(q);
        el.style.display = m ? "" : "none"; if (m) n++ });
      $("songCount").textContent = n + " songs" };
    // Preloader
    (function() {
      const pl = $("preloader"),
        fill = $("plFill"),
        pct = $("plPct");
      let p = 0,
        loaded = document.readyState === "complete";
      const start = performance.now();
      addEventListener("load", () => loaded = true);
      
      function finish() {
        pl.classList.add("hide");
        document.body.classList.remove("loading");
        setTimeout(() => pl.remove(), 1300);
      }
      
      function tick(now) {
        const el = now - start;
        const target = (loaded && el > 1800) ? 100 : Math.min(90, el / 2200 * 90);
        p += (target - p) * .07;
        if (target === 100 && p > 99.4) p = 100;
        fill.style.transform = "scaleX(" + p / 100 + ")";
        pct.textContent = Math.round(p) + "%";
        if (p < 100) requestAnimationFrame(tick);
        else setTimeout(finish, 350);
      }
      requestAnimationFrame(tick);
    })();
    // Offline support (needs sw.js + manifest.json next to this file, served over HTTPS)
    (function() {
      const box = $("offlineStatus"),
        txt = $("offlineText"),
        bar = $("offlineBar");
      const show = (t, pct) => { box.hidden = false;
        txt.textContent = t; if (pct != null) bar.style.width = pct + "%" };
      const urls = [...new Set(songs.flatMap(s => [s.src, s.cover]).map(p => new URL(encodeURI(p.replace(/^\//, "")), location.href).href))];
      addEventListener("offline", () => show("You’re offline · playing from saved songs"));
      if (!navigator.onLine) show("You’re offline · playing from saved songs");
      if (!("serviceWorker" in navigator)) return;
      navigator.serviceWorker.addEventListener("message", e => {
        const d = e.data;
        if (!d || d.type !== "PROGRESS") return;
        const pct = d.total ? Math.round(d.done / d.total * 100) : 100;
        if (d.done < d.total) show("Saving for offline · " + d.done + " / " + d.total, pct);
        else show(d.failed ? "Saved for offline · " + (d.total - d.failed) + " of " + d.total + " files" : "All songs saved for offline", 100);
      });
      addEventListener("load", () => {
        try {
          navigator.serviceWorker.register("sw.js")
            .then(() => navigator.serviceWorker.ready)
            .then(reg => {
              if (reg.active) reg.active.postMessage({ type: "CACHE_MEDIA", urls });
              if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
            }).catch(() => {});
        } catch (_) {}
      });
    })();
  </script>
</body>
